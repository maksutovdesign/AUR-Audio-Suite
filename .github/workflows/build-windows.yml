name: Build Windows VST3

# Builds Windows x64 VST3 for all 54 plugins on GitHub Windows runners
# (they can't be cross-compiled from macOS). Each plugin is its own matrix
# job (parallel, visible per-plugin progress) instead of one long sequential
# loop. A final job collects everything into per-plugin + suite zips and
# attaches them to the v0.1.0 release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE_TAG: v0.1.0

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        module:
          - EMBER
          - CLARITY
          - GRIP
          - CEIL
          - PRISM
          - HAZE
          - SCOPE
          - IMAGER
          - DELAY
          - MOTION
          - ASSIST
          - FORGE
          - DEESS
          - DEHUM
          - GATE
          - DENOISE
          - CHORUS
          - FLANGER
          - PHASER
          - TREMOLO
          - CLIPPER
          - CRUSH
          - TRANSIENT
          - MULTI
          - EXCITE
          - GAIN
          - GONIO
          - TUNER
          - PITCH
          - CONVO
          - RING
          - AURORA
          - PULSE
          - NOVA
          - MINI
          - PLUCK
          - SUB
          - SUPER
          - CHIP
          - DRONE
          - ORGAN
          - BELL
          - STRING
          - RES
          - KIT8
          - KIT9
          - FMPERC
          - WAVE
          - VECTOR
          - GRAIN
          - PAD
          - BEAT
          - HYPER
          - MORPH
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/juce
          key: juce-8.0.4-windows

      - name: Clone JUCE 8.0.4
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git "${{ github.workspace }}\juce"

      - name: Configure
        shell: pwsh
        run: cmake -B "${{ matrix.module }}/build" -S "${{ matrix.module }}" -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ github.workspace }}\juce"

      - name: Build VST3
        shell: pwsh
        run: cmake --build "${{ matrix.module }}/build" --config Release --target "${{ matrix.module }}_VST3"

      - name: Package
        shell: pwsh
        run: |
          $M = "${{ matrix.module }}"
          $vst3 = Get-ChildItem -Path "$M/build/${M}_artefacts/Release/VST3" -Filter *.vst3 -Directory -ErrorAction Stop | Select-Object -First 1
          $stage = "stage\AUR $M"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force $vst3.FullName "$stage\"
          "AUR $M (Windows) - AUR Audio`nCopy 'AUR $M.vst3' to your VST3 folder:`n  C:\Program Files\Common Files\VST3\`nThen rescan plug-ins in your DAW." | Out-File -Encoding utf8 "$stage\INSTALL.txt"
          Compress-Archive -Path $stage -DestinationPath "AUR-$M-Windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AUR-${{ matrix.module }}-Windows
          path: AUR-${{ matrix.module }}-Windows.zip
          retention-days: 7

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + build suite zip
        run: |
          mkdir -p dist
          find artifacts -name '*.zip' -exec cp {} dist/ \;
          cd dist
          mkdir -p suite-extract
          for z in AUR-*-Windows.zip; do unzip -oq "$z" -d suite-extract; done
          cd suite-extract && zip -rq ../AUR-Windows-VST3-Suite.zip . && cd ..
          rm -rf suite-extract
          echo "Collected $(ls AUR-*-Windows.zip | wc -l) per-plugin zips"
          ls -la

      - name: Attach everything to release ${{ env.RELEASE_TAG }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber -R ${{ github.repository }}
